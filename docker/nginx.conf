# tijmenopstoom.nl — nginx-configuratie binnen de container
#
# Dit bestand komt terecht in /etc/nginx/conf.d/default.conf en draait dus
# binnen het http-blok van de standaardconfiguratie van het nginx-image.
#
# TLS, HSTS en het echte bezoekersadres komen van Nginx Proxy Manager; deze
# container luistert alleen op poort 80 binnen het proxy-network en is niet
# rechtstreeks vanaf internet bereikbaar.

# Het adres van de bezoeker zit in X-Real-IP, gezet door NPM. Zonder deze
# regels staat in elke logregel het interne adres van de proxycontainer.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Real-IP;

# Cache-Control per pad, in één map in plaats van losse add_header-regels per
# location. Dat voorkomt de bekende nginx-valkuil dat een add_header in een
# location álle add_headers van het serverblok uitschakelt.
#
# Geen 'immutable' op css/js: main.css en lightbox.js dragen geen versie in hun
# naam, dus na een restyling zou een terugkerende bezoeker de oude stylesheet
# houden. Een week is lang genoeg en herstelt zichzelf. Foto's (/assets/fotos/,
# webp met een datum in de naam), de intro-video en de headerfoto's veranderen
# alleen doordat er een bestand bíj komt — die mogen een maand blijven staan.
map $uri $site_cache {
    default                 "public, max-age=0, must-revalidate";
    ~^/assets/(css|js)/     "public, max-age=604800";
    ~^/assets/              "public, max-age=2592000";
}

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_comp_level   6;
# Geen webp, mp4 of woff2 in deze lijst: die zijn al gecomprimeerd en zouden
# alleen processortijd kosten.
gzip_types        text/plain text/css text/xml application/xml application/xml+rss
                  application/atom+xml application/javascript application/json
                  image/svg+xml application/manifest+json;

# www gaat naar het kale domein, net zoals GitHub Pages dat deed. In de DNS is
# www een CNAME naar tijmenopstoom.nl, dus dit verzoek komt hier binnen.
server {
    listen 80;
    server_name www.tijmenopstoom.nl;
    return 301 https://tijmenopstoom.nl$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # NPM beëindigt TLS en stuurt door op http. Zonder deze twee regels bouwt
    # nginx bij een mapredirect een absolute URL met zijn eigen containernaam
    # erin, en belandt de bezoeker op http://tijmenopstoom-site/fotos/.
    absolute_redirect off;
    port_in_redirect  off;

    add_header Cache-Control          $site_cache                      always;
    add_header X-Content-Type-Options nosniff                          always;
    add_header X-Frame-Options        SAMEORIGIN                       always;
    add_header Referrer-Policy        strict-origin-when-cross-origin  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Voor Uptime Kuma. Staat los van de site, zodat een controle elke minuut
    # niet in de bezoekersstatistieken of het toegangslogboek terechtkomt.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Jekyll schrijft mappen met een index.html (/fotos/index.html, /expedities/
    # dresden/index.html) plus losse bestanden in de root: 404.html, robots.txt,
    # sitemap.xml, expedities.xml en feed.xml. De volgorde hieronder is hoe
    # GitHub Pages het ook oploste — /fotos werkt en stuurt door naar /fotos/.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Verborgen bestanden nooit uitleveren. In _site hoort niets te staan wat
    # met een punt begint, maar dit kost niets en scheelt een verrassing.
    # .well-known blijft er bewust buiten: daar loopt de certificaatcontrole
    # van Let's Encrypt overheen.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
