# Fotodatabase — Tijmen op Stoom
#
# Nieuwe foto's toevoegen? Zet de originelen in een map en draai:
#     python3 tools/foto-import.py <map>
# Dat maakt de WebP-varianten in assets/fotos/ en print kant-en-klare
# regels voor dit bestand. Vul daarna titel, type en locatie aan.
#
# Velden
#   bestand      bestandsnaam in assets/fotos/ (verplicht) — de -thumb.webp
#                variant wordt automatisch gebruikt in de grid
#   titel        korte titel (verplicht)
#   vervoerder   sleutel uit _data/labels.yml > vervoerder
#   type         sleutel uit _data/labels.yml > type
#   land         nl | de | ch | at | be
#   evenement    vrije tekst; moet exact matchen met fotos_evenement
#                in een expeditie om daar te verschijnen
#   locatie      vrije tekst
#   datum        YYYY-MM-DD
#   beschrijving caption in de lightbox
#   breedte      pixelmaten van de grote variant (voorkomt layout-shift)
#   hoogte
#   hero         true = mag als headerfoto op de homepage gekozen worden
#                (alleen liggende foto's)
#   fotograaf    optioneel; leeg = site.author.name
#
# Filters op /fotos/ worden uit deze data opgebouwd — een nieuwe waarde
# verschijnt vanzelf in het keuzemenu zodra hij in _data/labels.yml staat.

