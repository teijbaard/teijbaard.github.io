name: Build & Deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  # Dagelijks: nieuwste YouTube-video ophalen en zo nodig de headerfoto rouleren.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      nieuwe_headerfoto:
        description: "Meteen een andere headerfoto kiezen (negeert de week-termijn)"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om _data/youtube.yml en _data/hero.yml terug te committen
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false   # niet afbreken tijdens een push van de bot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nieuwste YouTube-video ophalen
        if: github.event_name != 'push'
        continue-on-error: true   # een hikkende feed mag de deploy niet blokkeren
        run: python3 tools/haal-youtube.py

      - name: Headerfoto rouleren
        if: github.event_name != 'push'
        continue-on-error: true   # mislukt dit, dan blijft simpelweg de huidige foto staan
        run: python3 tools/roteer-hero.py ${{ inputs.nieuwe_headerfoto && '--forceer' || '' }}

      - name: Wijzigingen terugcommitten
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain _data)" ]; then
            echo "Niets veranderd in _data/ — geen commit nodig."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data
          git commit -m "chore: headerfoto en YouTube-video bijgewerkt"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true  # leest BUNDLED WITH uit Gemfile.lock en installeert die versie

      - name: Schrijf build-secrets naar _data
        env:
          N8N_WEBHOOK_URL: ${{ secrets.n8n_webhook_url }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::error::Secret n8n_webhook_url ontbreekt; het contactformulier zou zonder werkende actie live gaan."
            exit 1
          fi
          printf 'n8n_webhook_url: "%s"\n' "$N8N_WEBHOOK_URL" > _data/secrets.yml

      - name: Build site
        env:
          JEKYLL_ENV: production   # anders bouwt Jekyll in 'development' en blijven de statistieken uit
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
