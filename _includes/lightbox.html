{%- comment -%}
  Gedeelde lightbox voor /fotos/ en de expeditiepagina's.
  De markup staat één keer hier, het gedrag in assets/js/lightbox.js.
  Elke aanklikbare kaart heeft een <button class="foto-open"> en een
  <script type="application/json" class="foto-data"> met de gegevens.
{%- endcomment -%}
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"
     aria-labelledby="lightbox-title" hidden>
  <div class="lightbox-inner">
    <div class="lightbox-img-wrap">
      <img src="" alt="" id="lightbox-img">
      <button class="lightbox-nav prev" id="lightbox-prev" type="button" aria-label="Vorige foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="lightbox-nav next" id="lightbox-next" type="button" aria-label="Volgende foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Sluiten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="lightbox-body">
      <h2 class="lightbox-title" id="lightbox-title"></h2>
      <p class="lightbox-desc" id="lightbox-desc"></p>
      <div class="lightbox-details" id="lightbox-details"></div>
    </div>
  </div>
</div>
<script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer
        data-basis="{{ '/assets/fotos/' | relative_url }}"></script>
